# docker-compose.local.yml — the ONE local dev stack.
#
#   yarn services:up     Postgres (:5442) + Redis (:6389) only — what `yarn dev`
#                        and `yarn backend:up` start before running the API on
#                        the host (tsx watch, :4444)
#   yarn services:down   stop them (data kept in the named volumes)
#   yarn docker:reset    stop them AND drop the volumes (fresh database)
#   docker compose -f docker-compose.local.yml up api
#                        optional: the API itself in a container (Dockerfile
#                        `dev` target, source bind-mounted, :4444)
#
# Same Postgres/Redis majors as production (infra/data/docker-compose.data.yml).
# E2E and the image boot-smoke have their own ephemeral stacks
# (docker-compose.e2e.yml · docker-compose.smoke.yml).

services:
  db:
    image: postgres:15-alpine
    container_name: pombo-db
    restart: unless-stopped
    ports:
      - "5442:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pombo-redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: pombo-api
    ports:
      - "4444:4444"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      - NODE_ENV=local
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://postgres:123123@db:5432/postgres?schema=public
    volumes:
      - ./apps/api:/usr/src/app/apps/api
      - /usr/src/app/apps/api/node_modules

volumes:
  postgres_data:
  redis_data:
